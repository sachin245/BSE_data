name: Deploy to Railway

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React Frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
          mv frontend/dist ./dist

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API & MCP
        run: railway up --service api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Streamlit Admin
        run: railway up --service admin --command "streamlit run app.py --server.port \$PORT --server.address 0.0.0.0" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
